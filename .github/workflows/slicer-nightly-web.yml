# Publish the SlicerWeb application with the WebAssembly runtime that Slicer's continuous
# integration builds, and the extensions their own repositories build against it, rather than
# with a runtime built and uploaded from a computer.
#
# The Build workflow of Slicer (here Sunderlandkyl/Slicer, branch ci/github-actions-build) builds
# the runtime with SlicerWeb, from the Slicer commit it builds, and publishes it to its nightly
# release as slicerweb-wheels.zip. The extensions are built against it by their own repositories,
# in the order of their dependencies, which Slicer's Reconcile extensions workflow sees to; it
# then publishes extensions-catalog.json to the same release: per platform, the extensions whose
# package is built against that Slicer commit and against the very packages of the extensions it
# depends on, with the address and the hash of each. This workflow:
#
#   1. takes the runtime from there, adds the configuration of this application (application.json,
#      but for the extensions) and records this repository in build-info.json, as SlicerWeb's
#      build.py does;
#   2. gathers the web wheels the catalog lists, when the catalog is of the Slicer commit of that
#      runtime, checks each against its hash, and writes the extension index the Extensions
#      Manager reads. An extension the catalog does not list (not built yet, or not consistent
#      with what it depends on) is not offered. The catalog gives each extension a tier: that of
#      the Slicer ExtensionsIndex (1 to 5) when its repository is the one named there, 0 when it
#      is not reviewed. The reviewed ones go to extensions/index.json, which the Extensions
#      Manager offers; the others to extensions/unreviewed.json, which it offers only to a user
#      who asks for them. One that depends on an extension that is not reviewed counts as not
#      reviewed either.
#      A page cannot download files from GitHub releases, which refuse cross-origin requests.
#      With the EXTENSION_PROXY repository variable set to the address of the relay of Slicer's
#      extension webhook, which hands them out, the index gives the address of each wheel there
#      and the site carries none: the page checks each against the hash the index gives. Without
#      it the site carries the wheels of the reviewed extensions, and offers no other: it does
#      not hand out code nobody reviewed;
#   3. uploads both to the release runtime-<channel> of this repository, as wheels.zip and
#      extensions.zip, and builds the site with the Publish app workflow of SlicerWeb, from the very
#      SlicerWeb commit the runtime was built with (build-info.json says which), which pushes it to
#      the branch deploy/<channel>, which GitHub Pages serves.
#
# Slicer's Reconcile extensions workflow starts it when the catalog changed (through its "Slicer
# nightly" GitHub App, installed here). It also runs every few hours, in case that was missed, and
# publishes only when the runtime or an extension changed. It can also be run by hand.
name: Publish app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel: latest, or another (stable, 1.0.0). Published to branch deploy/<channel> from release runtime-<channel>"
        default: latest
      slicerRepository:
        description: Repository whose release holds the runtime Slicer's CI built
        default: Sunderlandkyl/Slicer
      slicerRelease:
        description: That release
        default: nightly
      force:
        description: Publish even if neither the runtime nor an extension changed
        type: boolean
        default: false
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: write   # write the runtime release, push the site to its branch

env:
  CHANNEL: ${{ inputs.channel || 'latest' }}
  SLICER_REPOSITORY: ${{ inputs.slicerRepository || 'Sunderlandkyl/Slicer' }}
  SLICER_RELEASE: ${{ inputs.slicerRelease || 'nightly' }}

jobs:
  runtime:
    name: Runtime and extensions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.runtime.outputs.changed }}
      sources: ${{ steps.runtime.outputs.sources }}
      slicerwebRepository: ${{ steps.runtime.outputs.slicerwebRepository }}
      slicerwebRef: ${{ steps.runtime.outputs.slicerwebRef }}
    steps:
      - uses: actions/checkout@v4

      - name: Runtime of ${{ env.SLICER_REPOSITORY }}, and the extensions built against it
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: runtime-${{ env.CHANNEL }}
          FORCE: ${{ inputs.force || false }}
          EXTENSION_PROXY: ${{ vars.EXTENSION_PROXY }}
        run: |
          set -euo pipefail
          proxy="${EXTENSION_PROXY%/}"
          work="$RUNNER_TEMP/runtime"
          mkdir -p "$work/wheels" "$work/extensions" "$work/upload"
          gh release download "$SLICER_RELEASE" -R "$SLICER_REPOSITORY" -D "$work" --clobber \
            -p slicerweb-wheels.zip
          unzip -q "$work/slicerweb-wheels.zip" -d "$work/wheels"

          info="$work/wheels/build-info.json"
          cat "$info"
          slicerwebRepository="$(jq -r '.slicerweb.repository' "$info")"
          slicerwebRef="$(jq -r '.slicerweb.commit' "$info")"
          slicer="$(jq -r '.slicer.commit // empty' "$info")"
          echo "slicerwebRepository=$slicerwebRepository" >> "$GITHUB_OUTPUT"
          echo "slicerwebRef=$slicerwebRef" >> "$GITHUB_OUTPUT"

          # What build.py adds for an application: its configuration but for the extensions
          # (wheels/application.json, read at startup), and its commit in build-info.json.
          jq 'del(.extensions)' application.json > "$work/wheels/application.json"
          jq --arg name "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            '. + {application: {name: $name, commit: $commit, modified: false}}' "$info" > "$info.new"
          mv "$info.new" "$info"

          # The extensions: the web packages of the catalog of that release, which lists the ones
          # built against the Slicer commit of the runtime and consistent with each other. A
          # release asset is public, and downloaded without the API.
          entries="[]"
          unreviewed="[]"
          sources="[]"
          catalog="$work/extensions-catalog.json"
          if [ -z "$slicer" ]; then
            echo "::warning::The runtime does not record its Slicer commit: no extension can be matched to it"
          elif ! gh release download "$SLICER_RELEASE" -R "$SLICER_REPOSITORY" -D "$work" --clobber \
                 -p extensions-catalog.json 2>/dev/null; then
            echo "::warning::No extensions-catalog.json in the $SLICER_RELEASE release of $SLICER_REPOSITORY"
          elif [ "$(jq -r '.platforms.web.slicer_commit // empty' "$catalog")" != "$slicer" ]; then
            echo "::warning::The catalog is of Slicer $(jq -r '.platforms.web.slicer_commit // "?"' "$catalog" | cut -c1-7), not ${slicer:0:7}, the runtime's: no extension offered until it is made again"
          else
            jq -r '.withheld.web // {} | to_entries[] | "\(.key): left out, \(.value)"' "$catalog"
            # The tier of each: its own, or 0 when anything it depends on is not reviewed.
            tiers="$(python3 - "$catalog" <<'PY'
          import json, sys
          extensions = json.load(open(sys.argv[1]))["platforms"]["web"]["extensions"]
          def tier(name, seen=()):
              entry = extensions.get(name)
              if entry is None or name in seen:
                  return 0 if entry is None else int(entry.get("tier") or 0)
              return min([int(entry.get("tier") or 0)] + [tier(d, seen + (name,)) for d in entry.get("depends") or []])
          print(json.dumps({name: tier(name) for name in extensions}))
          PY
            )"
            for name in $(jq -r '.platforms.web.extensions | keys[]' "$catalog"); do
              entry="$(jq -c --arg n "$name" '.platforms.web.extensions[$n]' "$catalog")"
              web="$(jq -c '.web // empty' <<< "$entry")"
              wheel="$(jq -r .file <<< "$entry")"
              if [ -z "$web" ]; then
                echo "::warning::$name: no entry of the extension index in the catalog"
                continue
              fi
              tier="$(jq -r --arg n "$name" '.[$n] // 0' <<< "$tiers")"
              expected="$(jq -r '.sha256 // empty' <<< "$entry")"
              icon="$(jq -r '.icon // empty' <<< "$web")"
              if [ -n "$proxy" ]; then
                # Nothing is carried: the wheel is read through the relay, which hands out the
                # files of the release, and checked by the page against this hash. An image
                # needs no relay.
                if [ -z "$expected" ]; then
                  echo "::warning::$name: the catalog gives no hash for $wheel; left out"
                  continue
                fi
                address="$(jq -r .url <<< "$entry" | sed -E "s#^https://github.com/([^/]+/[^/]+)/releases/download/#$proxy/gh/\\1/#")"
                if [[ "$address" != "$proxy/gh/"* ]]; then
                  echo "::warning::$name: $(jq -r .url <<< "$entry") is not a file of a GitHub release; left out"
                  continue
                fi
                web="$(jq -c --arg w "$address" '.wheel = $w' <<< "$web")"
                if [ -n "$icon" ] && [[ "$icon" != *://* ]]; then
                  web="$(jq -c --arg i "$(jq -r '.icon // empty' <<< "$entry")" '.icon = $i' <<< "$web")"
                fi
              else
                if [ "$tier" -lt 1 ]; then
                  echo "$name: not reviewed (tier 0); not carried by the site, and not offered without EXTENSION_PROXY"
                  continue
                fi
                if ! curl -sfL --retry 3 "$(jq -r .url <<< "$entry")" -o "$work/extensions/$wheel"; then
                  echo "::warning::$name: could not download $wheel"
                  continue
                fi
                if [ -n "$expected" ] && [ "$(sha256sum < "$work/extensions/$wheel" | cut -d' ' -f1)" != "$expected" ]; then
                  echo "::warning::$name: $wheel is not the file the catalog lists (another build was published since); left out"
                  rm -f "$work/extensions/$wheel"
                  continue
                fi
                # An icon file of the release is carried by the site; an address (the extension's
                # EXTENSION_ICONURL) is left as it is.
                if [ -n "$icon" ] && [[ "$icon" != *://* ]] \
                   && ! curl -sfL --retry 3 "$(jq -r '.icon // empty' <<< "$entry")" -o "$work/extensions/$icon"; then
                  echo "::warning::$name: could not download $icon"
                  web="$(jq -c '.icon = ""' <<< "$web")"
                fi
              fi
              web="$(jq -c --arg s "$expected" --argjson t "$tier" '. + {sha256: $s, tier: $t}' <<< "$web")"
              echo "$name: $(jq -r .repository <<< "$entry") $(jq -r .revision <<< "$entry"), tier $tier"
              if [ "$tier" -ge 1 ]; then
                entries="$(jq -c --argjson e "$web" '. + [$e]' <<< "$entries")"
              else
                unreviewed="$(jq -c --argjson e "$web" '. + [$e]' <<< "$unreviewed")"
              fi
              sources="$(jq -c --argjson e "$entry" --argjson t "$tier" --arg w "$(jq -r .wheel <<< "$web")" \
                '. + [$e | {repository, revision, wheel: $w, sha256, tier: $t}]' <<< "$sources")"
            done
          fi
          jq -n --argjson e "$entries" '{extensions: $e}' > "$work/extensions/index.json"
          jq -n --argjson e "$unreviewed" '{extensions: $e}' > "$work/extensions/unreviewed.json"
          echo "Extensions: $(jq -r '[.extensions[].name] | join(", ")' "$work/extensions/index.json")"
          echo "Not reviewed: $(jq -r '[.extensions[].name] | join(", ") | if . == "" then "none" else . end' "$work/extensions/unreviewed.json")"

          # What this publication is made of. Unchanged since the last one that reached the
          # site (deployed.json, written once the site is published), there is nothing to do.
          # Not sources.json, which describes the runtime release and is uploaded before the
          # site is built: a run cancelled in between would leave it saying the site is up to
          # date when it is not, and every later run would then do nothing.
          jq -n --arg date "$(jq -r .date "$info")" --arg slicer "$slicer" --arg app "$GITHUB_SHA" \
                --argjson extensions "$sources" \
            '{runtime: {date: $date, slicer: $slicer}, application: $app, extensions: $extensions}' \
            > "$work/upload/sources.json"
          cat "$work/upload/sources.json"
          changed=true
          if [ "$FORCE" != "true" ] \
             && gh release download "$RUNTIME" -p deployed.json -O "$work/published-sources.json" 2>/dev/null \
             && [ "$(jq -S . "$work/published-sources.json")" = "$(jq -S . "$work/upload/sources.json")" ]; then
            changed=false
            echo "::notice::Neither the runtime nor an extension changed since the last publication."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "sources=$(jq -c . "$work/upload/sources.json")" >> "$GITHUB_OUTPUT"
          [ "$changed" = "true" ] || exit 0

          (cd "$work/wheels" && zip -q -r "$work/upload/wheels.zip" .)
          (cd "$work/extensions" && zip -q -r "$work/upload/extensions.zip" .)

          built="$(jq -r '.date' "$info")"
          names="$(jq -r '[.extensions[].name] | join(", ")' "$work/extensions/index.json")"
          notes="WebAssembly runtime of SlicerWeb: the wheels the application is built on (VTK, ITK, the Slicer libraries and modules), and the extension wheels built against it: ${names:-none}.

          Runtime built ${built} by the continuous integration of ${SLICER_REPOSITORY} (release ${SLICER_RELEASE}), from Slicer ${slicer:-the revision SlicerWeb pins} and ${slicerwebRepository} ${slicerwebRef:0:7}, for ${GITHUB_REPOSITORY} ${GITHUB_SHA:0:7}. sources.json says what each part comes from."
          if gh release view "$RUNTIME" >/dev/null 2>&1; then
            gh release edit "$RUNTIME" --notes "$notes"
          else
            gh release create "$RUNTIME" --title "Runtime wheels" --notes "$notes" --prerelease --latest=false
          fi
          gh release upload "$RUNTIME" "$work"/upload/* --clobber
          {
            echo "### Runtime"
            echo ""
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: runtime
    if: needs.runtime.outputs.changed == 'true'
    # The workflow of the SlicerWeb that builds the runtime in Slicer's CI.
    uses: Sunderlandkyl/SlicerWeb/.github/workflows/publish-app.yml@ci/slicer-actions
    with:
      appRepository: ${{ github.repository }}
      appBranch: deploy/${{ inputs.channel || 'latest' }}
      runtime: runtime-${{ inputs.channel || 'latest' }}
      slicerwebRepository: ${{ needs.runtime.outputs.slicerwebRepository }}
      slicerwebRef: ${{ needs.runtime.outputs.slicerwebRef }}
    secrets: inherit

  # What the site is now made of, recorded once it is published: what the next run compares
  # with, to know whether there is anything to do.
  record:
    name: Record what is published
    needs: [runtime, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME: runtime-${{ inputs.channel || 'latest' }}
          SOURCES: ${{ needs.runtime.outputs.sources }}
        run: |
          set -euo pipefail
          jq . <<< "$SOURCES" > deployed.json
          gh release upload "$RUNTIME" deployed.json --clobber
